<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reagendamento — Atividade 06</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js" defer></script>
</head>
<body>

    <main>
        <h1>Reservas da Biblioteca</h1>

        <label for="usuario">Quem está usando?</label>
        <select id="usuario">
            <option value="Ana">Ana</option>
            <option value="Bruno">Bruno</option>
        </select>

        <label for="data">Data:</label>
        <input type="date" id="data">

        <section id="secao-minhas">
            <h2>Minhas reservas</h2>
            <ul id="listaReservas"></ul>
        </section>

        <section id="secao-consultar">
            <h2>Consultar horários — Sala 1</h2>
            <ul id="listaHorarios"></ul>
        </section>

        <p id="mensagem"></p>

        <dialog id="dialogReagendar">
            <p><strong>Reagendar reserva</strong></p>
            <p id="detalheReserva"></p>
            <label for="novaHora">Novo horário:</label>
            <select id="novaHora"></select>
            <div class="acoes">
                <button id="btnVoltar" class="btn-secundario">Voltar</button>
                <button id="btnConfirmar" class="btn-primario">Confirmar</button>
            </div>
        </dialog>
    </main>

</body>
</html>
